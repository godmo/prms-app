name: prmsapp
description: "PRMS APP."
publish_to: 'none' 
version: 1.0.8+1

environment:
  sdk: '^3.7.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.8
  flutter_slidable: ^4.0.0
  flutter_spinkit: ^5.2.1
  
  # Scanning & Camera
  mobile_scanner: ^7.0.0
  image_picker: ^1.1.2
  
  # Networking & API
  http: ^1.1.0
  http_parser: ^4.1.2
  dio: ^5.7.0
  mqtt_client: ^10.5.1
  
  # Storage & Preferences
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  
  # State Management
  provider: ^6.1.2
  
  # Device & System Info
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.1
  network_info_plus: ^6.1.4
  device_info_plus: ^11.4.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  visibility_detector: ^0.4.0+2
  
  # Firebase
  firebase_core: ^2.32.0
  firebase_messaging: ^14.7.10
  
  # Authentication
  msal_auth: ^3.1.4
  
  # Build Tools
  flutter_launcher_icons: ^0.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Flutter configuration
flutter:
  uses-material-design: true
  
  # Assets configuration
  assets:
    - assets/machine.png
    - assets/put_on_flow.png
    - assets/take_off_flow.png
    - assets/app_config.json
    - assets/msal_config.json
    - assets/icon/app_icon_vis4.png

# App icon configuration
flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
